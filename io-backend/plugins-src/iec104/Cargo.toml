[package]
name = "iec104-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = false

[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--import-memory", "-C", "link-arg=--allow-undefined"]

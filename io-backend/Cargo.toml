[package]
name = "hmi-io-backend"
version = "0.3.0"
edition = "2021"

[dependencies]
extism = "1.30"
extism-manifest = "1.30"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower = "0.5"
rusqlite = { version = "0.34", features = ["bundled"] }
calamine = "0.26"
rust_xlsxwriter = "0.80"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMI IO Backend — 点位管理</title>
<style>
:root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --danger:#ef4444; --success:#22c55e; --warning:#f59e0b; --purple:#8b5cf6; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
header { background:var(--card); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
header h1 { font-size:18px; }
nav { display:flex; gap:8px; }
nav button, .btn { padding:6px 16px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; font-size:13px; }
nav button:hover, .btn:hover { background:var(--border); }
nav button.active { background:var(--accent); border-color:var(--accent); }
.btn-primary { background:var(--accent); border-color:var(--accent); }
.btn-danger { background:var(--danger); border-color:var(--danger); }
.btn-success { background:var(--success); border-color:var(--success); }
.btn-sm { padding:4px 10px; font-size:12px; }
main { max-width:1200px; margin:24px auto; padding:0 24px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
.card h3 { margin-bottom:12px; font-size:15px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--border); }
th { color:var(--muted); font-weight:600; }
tr:hover { background:rgba(255,255,255,0.03); }
.form-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; align-items:flex-end; }
.form-row label { font-size:12px; color:var(--muted); display:block; margin-bottom:2px; }
.form-row input, .form-row select { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:4px; font-size:13px; width:100%; min-width:80px; }
.form-row .field { flex:1; min-width:100px; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; }
.toast { position:fixed; bottom:20px; right:20px; background:var(--card); border:1px solid var(--border); padding:12px 20px; border-radius:8px; z-index:200; animation:fadein 0.3s; }
@keyframes fadein { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.spacer { flex:1; }
.action-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.empty { text-align:center; color:var(--muted); padding:32px; }

/* Monitor styles */
.status-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:12px; }
.status-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px; cursor:pointer; transition:border-color 0.2s; }
.status-card:hover { border-color:var(--accent); }
.status-card.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.status-card .plugin-name { font-size:15px; font-weight:600; margin-bottom:6px; }
.status-card .plugin-stats { display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12px; color:var(--muted); }
.status-card .plugin-stats span { display:flex; align-items:center; gap:4px; }
.status-card .plugin-stats .val { color:var(--text); font-weight:500; }
.state-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; }
.state-connected { background:rgba(34,197,94,0.15); color:var(--success); }
.state-error { background:rgba(239,68,68,0.15); color:var(--danger); }
.state-connecting { background:rgba(245,158,11,0.15); color:var(--warning); }
.state-disconnected { background:rgba(148,163,184,0.15); color:var(--muted); }

.packet-log { max-height:400px; overflow-y:auto; font-family:'Cascadia Code','Consolas',monospace; font-size:12px; background:var(--bg); border-radius:4px; padding:8px; }
.packet-entry { padding:4px 8px; border-bottom:1px solid rgba(255,255,255,0.04); display:flex; gap:12px; align-items:flex-start; }
.packet-entry:hover { background:rgba(255,255,255,0.03); }
.packet-dir { font-weight:600; min-width:24px; }
.packet-dir.tx { color:var(--accent); }
.packet-dir.rx { color:var(--success); }
.packet-time { color:var(--muted); min-width:60px; font-size:11px; }
.packet-hex { color:var(--warning); flex:1; word-break:break-all; font-size:11px; }
.packet-summary { color:var(--muted); font-size:11px; min-width:120px; }

.monitor-refresh { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
.uptime-bar { height:4px; background:var(--border); border-radius:2px; margin-top:6px; overflow:hidden; }
.uptime-fill { height:100%; background:var(--success); border-radius:2px; transition:width 1s linear; }

.value-null { color:var(--muted); font-style:italic; }
.value-good { color:var(--success); }
.value-stale { color:var(--warning); }
</style>
</head>
<body>
<header>
  <h1>&#x2699;&#xFE0F; HMI IO Backend</h1>
  <nav>
    <button id="nav-plugins" class="active" onclick="showTab('plugins')">协议插件</button>
    <button id="nav-points" onclick="showTab('points')">点位配置</button>
    <button id="nav-monitor" onclick="showTab('monitor')">监控调试</button>
  </nav>
</header>
<main id="app"></main>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
<div id="toast"></div>

<script>
const API = '';
let currentTab = 'plugins';
let plugins = [];
let currentPluginId = null;
let monitorInterval = null;
let selectedMonitorPlugin = null;

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body && !(body instanceof FormData)) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  else if (body instanceof FormData) { opts.body = body; }
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error(await r.text());
  const ct = r.headers.get('Content-Type')||'';
  if (ct.includes('application/json')) return r.json();
  return r;
}

function toast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = type==='error'?'var(--danger)':type==='success'?'var(--success)':'var(--border)';
  setTimeout(() => el.textContent='', 3000);
}

function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

function showTab(tab) {
  if (monitorInterval) { clearInterval(monitorInterval); monitorInterval = null; }
  currentTab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+tab).classList.add('active');
  if (tab === 'plugins') loadPlugins();
  else if (tab === 'points') loadPoints();
  else if (tab === 'monitor') loadMonitor();
}

// ============= Plugins Tab =============
async function loadPlugins() {
  try {
    plugins = await api('GET', '/api/plugins');
  } catch(e) { plugins = []; toast('加载插件失败: '+e.message, 'error'); }
  renderPlugins();
}
function renderPlugins() {
  let h = '<div class="card"><h3>协议插件列表</h3>';
  h += '<div class="action-bar"><button class="btn btn-primary" onclick="showPluginForm()">添加插件</button></div>';
  if (plugins.length === 0) h += '<div class="empty">暂无插件，请通过 config.yaml 初始化或添加新插件</div>';
  else {
    h += '<table><thead><tr><th>ID</th><th>名称</th><th>WASM文件</th><th>启用</th><th>操作</th></tr></thead><tbody>';
    plugins.forEach(p => { h += `<tr>
      <td>${p.id}</td><td>${esc(p.name)}</td><td>${esc(p.wasm_file)}</td>
      <td>${p.enabled ? '&#x2705;' : '&#x274C;'}</td>
      <td><button class="btn btn-sm" onclick="editPlugin(${p.id})">编辑</button>
      <button class="btn btn-sm btn-danger" onclick="deletePlugin(${p.id})">删除</button></td>
    </tr>`; });
    h += '</tbody></table>';
  }
  h += '</div>';
  document.getElementById('app').innerHTML = h;
}

function showPluginForm(id) {
  const p = id ? plugins.find(x => x.id === id) : null;
  const h = `<h3>${id?'编辑':'添加'}插件</h3>
    <div class="form-row">
      <div class="field"><label>名称</label><input id="f-name" value="${esc(p?p.name:'')}"></div>
      <div class="field"><label>WASM文件</label><input id="f-wasm" value="${esc(p?p.wasm_file:'')}"></div>
    </div>
    <div class="form-row">
      <div class="field"><label>配置JSON</label><input id="f-cfg" value="${esc(p?p.config_json:'')}"></div>
    </div>
    <div class="form-row">
      <div class="field"><label>启用</label><select id="f-enabled"><option value="1" ${p&&p.enabled?'selected':''}>是</option><option value="0" ${p&&!p.enabled?'selected':''}>否</option></select></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button class="btn btn-primary" onclick="savePlugin(${id||0})">保存</button>
      <button class="btn" onclick="closeModal();loadPlugins();">取消</button>
    </div>`;
  showModal(h);
}
async function savePlugin(id) {
  const data = {
    name: document.getElementById('f-name').value,
    wasm_file: document.getElementById('f-wasm').value,
    config_json: document.getElementById('f-cfg').value,
    enabled: document.getElementById('f-enabled').value === '1'
  };
  if (id) await api('PUT', '/api/plugins/'+id, data);
  else await api('POST', '/api/plugins', data);
  closeModal(); loadPlugins(); toast(id?'插件已更新':'插件已添加', 'success');
}
async function editPlugin(id) { showPluginForm(id); }
async function deletePlugin(id) {
  if (!confirm('确定删除？')) return;
  await api('DELETE', '/api/plugins/'+id);
  loadPlugins(); toast('已删除', 'success');
}

// ============= Points Tab =============
async function loadPoints() {
  try { plugins = await api('GET', '/api/plugins'); } catch(e) { plugins = []; }
  let h = '<div class="card"><h3>点位配置</h3>';
  h += '<div class="form-row"><div class="field"><label>选择插件</label><select id="plugin-select" onchange="onPluginChange()"><option value="">-- 请选择 --</option>';
  plugins.forEach(p => { h += `<option value="${p.id}" ${currentPluginId===p.id?'selected':''}>${esc(p.name)}</option>`; });
  h += '</select></div></div>';
  if (!currentPluginId) h += '<div class="empty">请先选择一个插件</div>';
  else {
    h += '<div class="action-bar"><button class="btn btn-primary" onclick="addPoint()">添加点位</button>';
    h += `<button class="btn btn-success" onclick="triggerImport()">导入 Excel</button>`;
    h += `<button class="btn" onclick="exportExcel()">导出 Excel</button>`;
    h += `<input type="file" id="import-file" style="display:none" accept=".xlsx,.xls" onchange="doImport(event)"></div>`;
    try {
      const points = await api('GET', '/api/points?plugin_id='+currentPluginId);
      if (points.length === 0) h += '<div class="card empty">暂无点位</div>';
      else {
        h += '<div class="card"><table><thead><tr><th>变量ID</th><th>协议地址</th><th>数据类型</th><th>字节序</th><th>缩放</th><th>偏移</th><th>变量类型</th><th>操作</th></tr></thead><tbody>';
        points.forEach(pt => { h += `<tr><td>${esc(pt.variable_id)}</td><td>${esc(pt.address)}</td><td>${esc(pt.data_type)}</td><td>${esc(pt.byte_order)}</td><td>${pt.scale}</td><td>${pt.offset_val}</td><td>${esc(pt.var_type)}</td><td><button class="btn btn-sm" onclick="editPoint(${pt.id})">编辑</button><button class="btn btn-sm btn-danger" onclick="deletePoint(${pt.id})">删除</button></td></tr>`; });
        h += '</tbody></table></div>';
      }
    } catch(e) { h += '<div class="card empty">加载失败: '+esc(e.message)+'</div>'; }
  }
  h += '</div>';
  document.getElementById('app').innerHTML = h;
}
function onPluginChange() {
  currentPluginId = document.getElementById('plugin-select').value ? parseInt(document.getElementById('plugin-select').value) : null;
  loadPoints();
}
function addPoint() { showPointForm(null); }
function editPoint(id) { showPointForm(id); }
function showPointForm(id) {
  const h = `<h3>${id?'编辑':'添加'}点位</h3>
    <div class="form-row"><div class="field"><label>变量ID</label><input id="f-vid" placeholder="STA1_211_IA"></div><div class="field"><label>协议地址</label><input id="f-addr" placeholder="holding_register:0"></div></div>
    <div class="form-row"><div class="field"><label>数据类型</label><input id="f-dtype" value="uint16"></div><div class="field"><label>字节序</label><input id="f-border" value="big_endian"></div></div>
    <div class="form-row"><div class="field"><label>缩放</label><input id="f-scale" value="1.0" type="number" step="any"></div><div class="field"><label>偏移</label><input id="f-offset" value="0" type="number" step="any"></div><div class="field"><label>变量类型</label><select id="f-vtype"><option>AI</option><option>DI</option><option>AO</option><option>DO</option></select></div></div>
    <div style="margin-top:12px;display:flex;gap:8px;"><button class="btn btn-primary" onclick="savePoint(${id||0})">保存</button><button class="btn" onclick="closeModal();loadPoints();">取消</button></div>`;
  showModal(h);
  if (id) { api('GET', '/api/points?plugin_id='+currentPluginId).then(pts => { const pt = pts.find(x => x.id === id); if (pt) { document.getElementById('f-vid').value = pt.variable_id; document.getElementById('f-addr').value = pt.address; document.getElementById('f-dtype').value = pt.data_type; document.getElementById('f-border').value = pt.byte_order; document.getElementById('f-scale').value = pt.scale; document.getElementById('f-offset').value = pt.offset_val; document.getElementById('f-vtype').value = pt.var_type; }}); }
}
async function savePoint(id) {
  const data = { plugin_id: currentPluginId, variable_id: document.getElementById('f-vid').value, address: document.getElementById('f-addr').value, data_type: document.getElementById('f-dtype').value, byte_order: document.getElementById('f-border').value, scale: parseFloat(document.getElementById('f-scale').value)||1, offset_val: parseFloat(document.getElementById('f-offset').value)||0, var_type: document.getElementById('f-vtype').value };
  if (id) await api('PUT', '/api/points/'+id, data);
  else await api('POST', '/api/points', data);
  closeModal(); loadPoints(); toast(id?'点位已更新':'点位已添加', 'success');
}
async function deletePoint(id) { if (!confirm('确定删除？')) return; await api('DELETE', '/api/points/'+id); loadPoints(); toast('已删除', 'success'); }
function triggerImport() { document.getElementById('import-file').click(); }
async function doImport(e) { const file = e.target.files[0]; if (!file) return; const fd = new FormData(); fd.append('file', file); try { const r = await api('POST', '/api/plugins/'+currentPluginId+'/import', fd); toast(`导入成功：${r.imported} 条记录`, 'success'); loadPoints(); } catch(err) { toast('导入失败: '+err.message, 'error'); } e.target.value = ''; }
function exportExcel() { window.open(API+'/api/plugins/'+currentPluginId+'/export', '_blank'); }

// ============= Monitor Tab =============
async function loadMonitor() {
  selectedMonitorPlugin = selectedMonitorPlugin || (plugins.length > 0 ? plugins[0].name : null);
  try { plugins = await api('GET', '/api/plugins'); } catch(e) {}
  if (!selectedMonitorPlugin && plugins.length > 0) selectedMonitorPlugin = plugins[0].name;
  await refreshMonitor();
  if (monitorInterval) clearInterval(monitorInterval);
  monitorInterval = setInterval(refreshMonitor, 1000);
}

async function refreshMonitor() {
  try {
    const snapshot = await api('GET', '/api/monitor/overview');
    renderMonitor(snapshot);

    if (selectedMonitorPlugin) {
      const [points, packets] = await Promise.all([
        api('GET', '/api/monitor/plugins/' + encodeURIComponent(selectedMonitorPlugin) + '/points'),
        api('GET', '/api/monitor/plugins/' + encodeURIComponent(selectedMonitorPlugin) + '/packets?limit=50')
      ]);
      renderMonitorDetail(selectedMonitorPlugin, points, packets);
    }
  } catch(e) { console.error('Monitor refresh error:', e); }
}

function renderMonitor(snapshot) {
  const className = (p) => {
    switch(p.connection_state) {
      case 2: return 'state-connected';
      case 3: return 'state-error';
      case 1: return 'state-connecting';
      default: return 'state-disconnected';
    }
  };
  const formatUptime = (ms) => {
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ' + (s%60) + 's';
    const h = Math.floor(m / 60);
    return h + 'h ' + (m%60) + 'm';
  };

  let h = '<div class="card"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;"><h3 style="margin:0;">&#x1F4CA; 运行状态监控</h3>';
  h += '<span class="monitor-refresh">&#x1F504; 自动刷新中 (1s)</span>';
  h += `<span class="spacer"></span>`;
  h += `<span style="font-size:12px;color:var(--muted);">服务器运行: ${formatUptime(snapshot.server_uptime_ms)} | 总扫描: ${snapshot.total_scans} | 总错误: ${snapshot.total_errors} | WS客户端: ${snapshot.active_ws_clients}</span></div>`;

  // Status cards
  h += '<div class="status-grid">';
  snapshot.plugins.forEach(p => {
    h += `<div class="status-card ${selectedMonitorPlugin===p.name?'selected':''}" onclick="selectMonitorPlugin('${esc(p.name)}')">
      <div class="plugin-name">&#x1F50C; ${esc(p.name)}
        <span class="state-badge ${className(p)}" style="float:right;">${esc(p.connection_label)}</span>
      </div>
      <div class="plugin-stats">
        <span>&#x1F4E1; 扫描次数: <span class="val">${p.scan_count}</span></span>
        <span>&#x274C; 错误次数: <span class="val" style="color:${p.error_count>0?'var(--danger)':'var(--muted)'}">${p.error_count}</span></span>
        <span>&#x23F1; 上次扫描: <span class="val">${p.last_scan_time_ms}ms</span></span>
        <span>&#x1F553; 运行时间: <span class="val">${formatUptime(p.uptime_ms)}</span></span>
      </div>
      ${p.last_error ? `<div style="margin-top:8px;font-size:11px;color:var(--danger);">&#x26A0; ${esc(p.last_error.substring(0,80))}</div>` : ''}
      <div class="uptime-bar"><div class="uptime-fill" style="width:${Math.min(100, (p.uptime_ms / snapshot.server_uptime_ms) * 100)}%"></div></div>
    </div>`;
  });
  h += '</div></div>';

  // Detail section placeholder
  h += '<div id="monitor-detail"></div>';
  document.getElementById('app').innerHTML = h;
}

function selectMonitorPlugin(name) {
  selectedMonitorPlugin = name;
  refreshMonitor();
}

function renderMonitorDetail(pluginName, points, packets) {
  const el = document.getElementById('monitor-detail');
  if (!el) return;

  const formatVal = (v) => {
    if (v === null || v === undefined) return '<span class="value-null">null</span>';
    if (typeof v === 'number') return `<span class="value-good">${Number.isInteger(v)?v:v.toFixed(2)}</span>`;
    return esc(String(v));
  };
  const formatAge = (ms) => {
    if (ms === 0) return '-';
    if (ms < 1000) return ms + 'ms';
    if (ms < 60000) return (ms/1000).toFixed(1) + 's';
    return (ms/60000).toFixed(1) + 'min';
  };
  const qClass = (q) => q === 'good' ? 'value-good' : q === 'unknown' ? 'value-null' : 'value-stale';

  let h = '<div class="card"><h3>&#x1F4E1; 点位实时值 — ' + esc(pluginName) + '</h3>';
  if (points.length === 0) {
    h += '<div class="empty">暂无点位数据</div>';
  } else {
    h += '<table style="table-layout:fixed;"><thead><tr><th style="width:22%;">变量ID</th><th style="width:18%;">协议地址</th><th style="width:6%;">类型</th><th style="width:12%;">当前值</th><th style="width:8%;">质量</th><th style="width:12%;">时间戳</th><th style="width:8%;">延迟</th><th style="width:14%;">配置</th></tr></thead><tbody>';
    points.forEach(pt => {
      const dt = pt.timestamp_ms ? new Date(pt.timestamp_ms).toISOString().substr(11,12) : '-';
      h += `<tr>
        <td title="${esc(pt.variable_id)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(pt.variable_id)}</td>
        <td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(pt.address)}</td>
        <td>${esc(pt.var_type)}</td>
        <td>${formatVal(pt.value)}</td>
        <td class="${qClass(pt.quality)}">${esc(pt.quality)}</td>
        <td style="font-size:11px;">${dt}</td>
        <td class="${pt.age_ms > 5000 ? 'value-stale' : ''}">${formatAge(pt.age_ms)}</td>
        <td style="font-size:11px;">${esc(pt.data_type)}/${esc(pt.byte_order)} &times;${pt.scale}+${pt.offset_val}</td>
      </tr>`;
    });
    h += '</tbody></table>';
  }
  h += '</div>';

  // Packet log
  h += '<div class="card"><h3>&#x1F4E8; 网络报文日志 — ' + esc(pluginName) + ' (最近50条)</h3>';
  if (packets.length === 0) {
    h += '<div class="empty">暂无报文日志（插件未通过 host_log 或 host_on_packet 上报数据包）</div>';
  } else {
    h += '<div class="packet-log">';
    packets.forEach(pkt => {
      const t = new Date(pkt.timestamp_ms > 1e12 ? pkt.timestamp_ms : Date.now()).toISOString().substr(11,12);
      h += `<div class="packet-entry">
        <span class="packet-dir ${pkt.direction}">${pkt.direction.toUpperCase()}</span>
        <span class="packet-time">${t}</span>
        <span class="packet-hex">${esc(pkt.hex_dump)}</span>
        <span class="packet-summary">${esc(pkt.summary.substring(0,60))}</span>
      </div>`;
    });
    h += '</div>';
  }
  h += '</div>';

  el.innerHTML = h;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Init
loadPlugins();
</script>

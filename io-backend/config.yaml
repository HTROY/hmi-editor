# HMI I/O Backend Configuration
# ================================

server:
  host: "0.0.0.0"
  port: 8080
  path: "/iscs/data"
  project_dir: "./projects"

plugins:
  directory: "./plugins"
  scan_interval_ms: 500

  instances:
    - name: "modbus_tcp"
      wasm_file: "modbus_tcp.wasm"
      config:
        host: "127.0.0.1"
        port: 502
        slave_id: 1
      points:
        - id: "STA1_211_ACB_STATUS"
          address: "coil:0"
          data_type: "bool"
          var_type: "DI"
        - id: "STA1_211_IA"
          address: "holding_register:0"
          data_type: "uint16"
          scale: 0.1
          var_type: "AI"
        - id: "STA1_BUS_VOLTAGE"
          address: "holding_register:2"
          data_type: "uint16"
          scale: 0.1
          var_type: "AI"
        - id: "STA1_FAN_1_STATUS"
          address: "coil:1"
          data_type: "bool"
          var_type: "DI"
        - id: "STA1_FAN_1_SPEED"
          address: "holding_register:4"
          data_type: "uint16"
          var_type: "AI"
        - id: "STA1_TEMP_ZONE1"
          address: "holding_register:6"
          data_type: "uint16"
          scale: 0.1
          var_type: "AI"
        - id: "STA1_211_ACB_CTRL"
          address: "coil:10"
          data_type: "bool"
          var_type: "DO"

    - name: "opc_ua"
      wasm_file: "opc_ua.wasm"
      config:
        endpoint: "opc.tcp://127.0.0.1:4840"
      points:
        - id: "STA1_TEMP_ZONE1"
          address: "ns=2;s=Temperature.Zone1"
          var_type: "AI"
        - id: "STA1_TEMP_ZONE2"
          address: "ns=2;s=Temperature.Zone2"
          var_type: "AI"

    - name: "iec104"
      wasm_file: "iec104.wasm"
      config:
        host: "127.0.0.1"
        port: 2404
        common_address: 1
      points:
        - id: "STA1_211_ACB_STATUS"
          address: "1001"
          data_type: "bool"
          var_type: "DI"
        - id: "STA1_212_ACB_STATUS"
          address: "1002"
          data_type: "bool"
          var_type: "DI"
        - id: "STA1_211_IA"
          address: "1003"
          data_type: "float32"
          var_type: "AI"
        - id: "STA1_211_IB"
          address: "1004"
          data_type: "float32"
          var_type: "AI"
        - id: "STA1_BUS_VOLTAGE"
          address: "1005"
          data_type: "float32"
          var_type: "AI"
        - id: "STA1_FAN_1_STATUS"
          address: "3001"
          data_type: "bool"
          var_type: "DI"
        - id: "STA1_FAN_1_SPEED"
          address: "3002"
          data_type: "float32"
          var_type: "AI"

alarm:
  enabled: true
  retention_alarm_days: 90
  retention_soe_days: 30
  rules:
    - id: "ALM_IA_OVER"
      variable_id: "modbus_tcp:STA1_211_IA"
      name: "A相过流"
      description: "A相电流超过1600A"
      severity: "major"
      group: "供电/400V"
      condition: "high"
      threshold: 1600
      enabled: true
      hysteresis: 0
      confirm_ms: 0
    - id: "ALM_BUS_LOW"
      variable_id: "modbus_tcp:STA1_BUS_VOLTAGE"
      name: "母线欠压"
      description: "母线电压低于350V"
      severity: "critical"
      group: "供电/400V"
      condition: "low"
      threshold: 350
      enabled: true
      hysteresis: 0
      confirm_ms: 0
    - id: "ALM_BUS_HIGH"
      variable_id: "modbus_tcp:STA1_BUS_VOLTAGE"
      name: "母线过压"
      description: "母线电压高于450V"
      severity: "major"
      group: "供电/400V"
      condition: "high"
      threshold: 450
      enabled: true
      hysteresis: 0
      confirm_ms: 0
    - id: "ALM_FAN_STOP"
      variable_id: "modbus_tcp:STA1_FAN_1_STATUS"
      name: "风机停机"
      description: "1号风机停止运行"
      severity: "minor"
      group: "BAS/环控"
      condition: "equal"
      threshold: 0
      enabled: true
      hysteresis: 0
      confirm_ms: 0
    - id: "ALM_TEMP_HIGH"
      variable_id: "modbus_tcp:STA1_TEMP_ZONE1"
      name: "站厅高温"
      description: "站厅温度超过30℃"
      severity: "warning"
      group: "BAS/环控"
      condition: "high"
      threshold: 30
      enabled: true
      hysteresis: 0
      confirm_ms: 0

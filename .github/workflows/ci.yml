name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend Editor (build + test + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  web-ui:
    name: Management Web UI (typecheck + build + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: io-backend/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: io-backend/web-ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  backend:
    name: Backend (fmt + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: io-backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: io-backend
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
